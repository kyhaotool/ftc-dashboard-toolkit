<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DATA LOGGER</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Consolas', monospace; background: #111; color: #ddd; min-height: 100vh; padding: 20px; }
        h1 { font-size: 18px; font-weight: 400; letter-spacing: 2px; margin-bottom: 20px; color: #fff; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media(max-width: 800px) { .grid { grid-template-columns: 1fr; } }
        .card { background: #1a1a1a; border: 1px solid #333; padding: 16px; }
        .card h2 { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #333; }
        .full { grid-column: 1 / -1; }
        .log { background: #0a0a0a; border: 1px solid #222; padding: 10px; height: 250px; overflow-y: auto; font-size: 10px; line-height: 1.6; }
        .log .t { color: #444; }
        .log .k { color: #888; }
        .log .v { color: #aaa; }
        .chart-box { background: #0a0a0a; border: 1px solid #222; height: 200px; }
        .chart-box canvas { width: 100%; height: 100%; }
        .btn { padding: 8px 16px; background: #ddd; color: #111; border: none; font-family: inherit; font-size: 11px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
        .btn:hover { background: #fff; }
        .btn.dark { background: #333; color: #ddd; }
        .btn.dark:hover { background: #444; }
        .btn.red { background: #5a2020; color: #ddd; }
        .btn-group { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .stat { background: #111; border: 1px solid #222; padding: 10px; text-align: center; }
        .stat-val { font-size: 18px; color: #fff; }
        .stat-lbl { font-size: 9px color: #555; text-transform: uppercase; margin-top: 2px; }
        .select { background: #111; border: 1px solid #333; color: #ddd; padding: 6px; font-family: inherit; font-size: 11px; width: 100%; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: #1a1a1a; border: 1px solid #333; padding: 20px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal h3 { font-size: 14px; color: #fff; margin-bottom: 12px; }
        .modal pre { background: #0a0a0a; border: 1px solid #222; padding: 12px; font-size: 10px; line-height: 1.5; color: #aaa; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
        .modal-actions { display: flex; gap: 6px; margin-top: 12px; }
        a.back { color: #666; font-size: 10px; text-decoration: none; text-transform: uppercase; letter-spacing: 1px; }
        a.back:hover { color: #fff; }
        .timer { font-size: 12px; color: #666; }
        .rec { color: #888; }
        .rec.on { color: #fff; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h1>DATA LOGGER</h1>
        <div style="display:flex;gap:12px;align-items:center">
            <span class="timer" id="timer">00:00:00</span>
            <a href="index.html" class="back">BACK</a>
        </div>
    </div>
    
    <div class="grid">
        <div class="card">
            <h2>LIVE TELEMETRY</h2>
            <div class="log" id="log"><div class="t">Waiting for data...</div></div>
            <div style="margin-top:8px">
                <select class="select" id="chartTag" onchange="updateChart()">
                    <option value="">-- SELECT TAG --</option>
                </select>
            </div>
            <div class="btn-group">
                <button class="btn" onclick="connect()">CONNECT</button>
                <button class="btn red" id="btnRec" onclick="toggleRecord()">RECORD</button>
                <button class="btn dark" onclick="clearData()">CLEAR</button>
            </div>
        </div>
        
        <div class="card">
            <h2>CHART</h2>
            <div class="chart-box"><canvas id="chart"></canvas></div>
        </div>
        
        <div class="card">
            <h2>STATS</h2>
            <div class="stats">
                <div class="stat"><div class="stat-val" id="sSamples">0</div><div class="stat-lbl">SAMPLES</div></div>
                <div class="stat"><div class="stat-val" id="sTags">0</div><div class="stat-lbl">TAGS</div></div>
                <div class="stat"><div class="stat-val" id="sDuration">0s</div><div class="stat-lbl">DURATION</div></div>
                <div class="stat"><div class="stat-val" id="sRate">0/s</div><div class="stat-lbl">RATE</div></div>
            </div>
        </div>
        
        <div class="card">
            <h2>EXPORT</h2>
            <div class="btn-group">
                <button class="btn" onclick="exportCSV()">CSV</button>
                <button class="btn" onclick="exportJSON()">JSON</button>
                <button class="btn" onclick="exportKotlin()">KOTLIN</button>
                <button class="btn dark" onclick="showLast()">LAST VALUES</button>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h3 id="modalTitle">EXPORT</h3>
            <pre id="modalContent"></pre>
            <div class="modal-actions">
                <button class="btn" onclick="copyModal()">COPY</button>
                <button class="btn" onclick="downloadModal()">DOWNLOAD</button>
                <button class="btn dark" onclick="closeModal()">CLOSE</button>
            </div>
        </div>
    </div>

    <script>
        let ws, connected = false, recording = false, data = [], tags = new Set(), last = {};
        let startTime = 0, samples = 0, chartData = {}, ctx, timer;
        
        function init() {
            ctx = document.getElementById('chart').getContext('2d');
            autoConnect();
        }
        
        function autoConnect() {
            const m = window.location.href.match(/http:\/\/([\d.]+):/);
            const ip = m ? m[1] : '192.168.43.1';
            
            try {
                ws = new WebSocket('ws://' + ip + ':8080/ws');
                ws.onopen = () => { connected = true; addLog('Connected to ' + ip, 's'); };
                ws.onmessage = (e) => { try { handleData(JSON.parse(e.data)); } catch(err) {} };
                ws.onclose = () => { connected = false; addLog('Disconnected', 'w'); };
                ws.onerror = () => { connected = false; startSim(); };
            } catch(e) {
                startSim();
            }
        }
        
        function connect() {
            if (connected) { ws.close(); return; }
            autoConnect();
        }
        
        function startSim() {
            let t = 0;
            setInterval(() => {
                if (!connected && recording) {
                    t += 0.05;
                    handleData({
                        timestamp: Date.now(),
                        velocity: 3000 * (1 - Math.exp(-t * 2)) + Math.sin(t * 3) * 50 + (Math.random() - 0.5) * 20,
                        target: 3000,
                        power: Math.min(1, Math.max(-1, (3000 - 2000) * 0.001)),
                        current: 2 + Math.random() * 0.5
                    });
                }
            }, 50);
        }
        
        function handleData(d) {
            if (!recording) return;
            
            data.push(d);
            samples++;
            
            Object.keys(d).forEach(k => {
                if (k === 'timestamp') return;
                tags.add(k);
                last[k] = d[k];
                if (!chartData[k]) chartData[k] = [];
                chartData[k].push(d[k]);
                if (chartData[k].length > 300) chartData[k].shift();
            });
            
            const log = document.getElementById('log');
            const entries = Object.entries(d).filter(([k]) => k !== 'timestamp')
                .map(([k, v]) => `<span class="k">${k}:</span> <span class="v">${typeof v === 'number' ? v.toFixed(2) : v}</span>`).join(' ');
            log.innerHTML += `<div><span class="t">[${new Date().toLocaleTimeString()}]</span> ${entries}</div>`;
            if (log.children.length > 100) log.removeChild(log.firstChild);
            log.scrollTop = log.scrollHeight;
            
            updateTags();
            updateStats();
            updateChart();
        }
        
        function toggleRecord() {
            if (recording) {
                recording = false;
                document.getElementById('btnRec').classList.remove('on');
                document.getElementById('btnRec').textContent = 'RECORD';
                clearInterval(timer);
            } else {
                recording = true;
                data = [];
                samples = 0;
                startTime = Date.now();
                chartData = {};
                tags.clear();
                last = {};
                document.getElementById('btnRec').classList.add('on');
                document.getElementById('btnRec').textContent = 'RECORDING';
                timer = setInterval(updateTimer, 1000);
                
                if (!connected) startSim();
            }
        }
        
        function updateTimer() {
            const e = Math.floor((Date.now() - startTime) / 1000);
            const h = String(Math.floor(e / 3600)).padStart(2, '0');
            const m = String(Math.floor((e % 3600) / 60)).padStart(2, '0');
            const s = String(e % 60).padStart(2, '0');
            document.getElementById('timer').textContent = h + ':' + m + ':' + s;
        }
        
        function updateTags() {
            const sel = document.getElementById('chartTag');
            const cur = sel.value;
            sel.innerHTML = '<option value="">-- SELECT TAG --</option>';
            tags.forEach(t => {
                const o = document.createElement('option');
                o.value = t;
                o.textContent = t;
                sel.appendChild(o);
            });
            if (cur && tags.has(cur)) sel.value = cur;
        }
        
        function updateStats() {
            document.getElementById('sSamples').textContent = samples;
            document.getElementById('sTags').textContent = tags.size;
            if (startTime > 0) {
                const e = Math.floor((Date.now() - startTime) / 1000);
                document.getElementById('sDuration').textContent = e + 's';
                document.getElementById('sRate').textContent = (samples / Math.max(1, e)).toFixed(1) + '/s';
            }
        }
        
        function updateChart() {
            const tag = document.getElementById('chartTag').value;
            if (!tag || !chartData[tag]) return;
            
            const cv = ctx.canvas;
            cv.width = cv.offsetWidth;
            cv.height = cv.offsetHeight;
            const w = cv.width, h = cv.height;
            
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, w, h);
            
            const d = chartData[tag];
            if (d.length < 2) return;
            
            let mn = Math.min(...d), mx = Math.max(...d);
            let r = mx - mn || 1;
            mn -= r * 0.1;
            mx += r * 0.1;
            
            ctx.strokeStyle = '#1a1a1a';
            for (let i = 0; i <= 4; i++) {
                ctx.beginPath();
                ctx.moveTo(0, h / 4 * i);
                ctx.lineTo(w, h / 4 * i);
                ctx.stroke();
            }
            
            ctx.strokeStyle = '#ccc';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            d.forEach((v, i) => {
                const x = i / 300 * w;
                const y = h - (v - mn) / (mx - mn) * h;
                i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            });
            ctx.stroke();
        }
        
        function clearData() {
            data = [];
            samples = 0;
            tags.clear();
            chartData = {};
            last = {};
            document.getElementById('log').innerHTML = '<div class="t">Cleared.</div>';
            document.getElementById('sSamples').textContent = '0';
            document.getElementById('sTags').textContent = '0';
            document.getElementById('sDuration').textContent = '0s';
            document.getElementById('sRate').textContent = '0/s';
            document.getElementById('timer').textContent = '00:00:00';
        }
        
        function addLog(msg, cls) {
            const l = document.getElementById('log');
            l.innerHTML += `<div><span class="${cls}">${msg}</span></div>`;
            l.scrollTop = l.scrollHeight;
        }
        
        function exportCSV() {
            if (!data.length) return;
            const h = Object.keys(data[0]);
            const csv = [h.join(','), ...data.map(r => h.map(k => r[k] ?? '').join(','))].join('\n');
            showModal('CSV', csv);
        }
        
        function exportJSON() {
            if (!data.length) return;
            showModal('JSON', JSON.stringify(data, null, 2));
        }
        
        function exportKotlin() {
            if (!data.length) return;
            const code = `@Config\nobject LoggedConfig {\n${Object.entries(last).map(([k, v]) => `    @JvmField var ${k} = ${typeof v === 'number' ? v.toFixed(4) : v}`).join('\n')}\n}`;
            showModal('KOTLIN', code);
        }
        
        function showLast() {
            const code = Object.entries(last).map(([k, v]) => `${k}: ${typeof v === 'number' ? v.toFixed(4) : v}`).join('\n');
            showModal('LAST VALUES', code || 'No data');
        }
        
        function showModal(title, content) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalContent').textContent = content;
            document.getElementById('modal').classList.add('active');
            document.getElementById('modal').dataset.content = content;
        }
        
        function closeModal() { document.getElementById('modal').classList.remove('active'); }
        function copyModal() { navigator.clipboard.writeText(document.getElementById('modal').dataset.content); }
        function downloadModal() {
            const b = new Blob([document.getElementById('modal').dataset.content], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(b);
            a.download = 'data_log.txt';
            a.click();
        }
        
        window.onload = init;
    </script>
</body>
</html>
