<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTO TUNE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Consolas', monospace; background: #111; color: #ddd; min-height: 100vh; padding: 20px; }
        h1 { font-size: 18px; font-weight: 400; letter-spacing: 2px; margin-bottom: 20px; color: #fff; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media(max-width: 900px) { .grid { grid-template-columns: 1fr; } }
        .card { background: #1a1a1a; border: 1px solid #333; padding: 16px; }
        .card h2 { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #333; }
        .full { grid-column: 1 / -1; }
        .field { margin-bottom: 10px; }
        .field label { display: block; font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .field input, .field select { width: 100%; padding: 8px; background: #111; border: 1px solid #333; color: #ddd; font-family: inherit; font-size: 12px; }
        .field input:focus, .field select:focus { outline: none; border-color: #888; }
        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn { padding: 8px 16px; background: #ddd; color: #111; border: none; font-family: inherit; font-size: 11px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
        .btn:hover { background: #fff; }
        .btn.dark { background: #333; color: #ddd; }
        .btn.dark:hover { background: #444; }
        .btn.green { background: #4a4a4a; color: #fff; }
        .btn.red { background: #5a2020; color: #ddd; }
        .btn-group { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
        .progress { margin-top: 12px; }
        .progress-header { display: flex; justify-content: space-between; font-size: 10px; color: #666; margin-bottom: 4px; }
        .progress-bar { height: 4px; background: #222; }
        .progress-fill { height: 100%; background: #888; transition: width 0.3s; }
        .result-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
        .result-item { background: #111; border: 1px solid #222; padding: 10px; text-align: center; }
        .result-value { font-size: 14px; color: #fff; }
        .result-label { font-size: 9px; color: #555; text-transform: uppercase; margin-top: 2px; }
        .log { background: #0a0a0a; border: 1px solid #222; padding: 10px; height: 160px; overflow-y: auto; font-size: 10px; line-height: 1.6; margin-top: 10px; }
        .log .t { color: #444; }
        .log .i { color: #777; }
        .log .s { color: #aaa; }
        .log .w { color: #888; }
        .chart-box { background: #0a0a0a; border: 1px solid #222; height: 200px; margin-top: 10px; }
        .chart-box canvas { width: 100%; height: 100%; }
        .run-item { display: flex; justify-content: space-between; padding: 4px 8px; background: #111; border-bottom: 1px solid #1a1a1a; font-size: 10px; }
        .run-item span { color: #666; }
        a.back { color: #666; font-size: 10px; text-decoration: none; text-transform: uppercase; letter-spacing: 1px; }
        a.back:hover { color: #fff; }
        .sep { border-top: 1px solid #222; margin: 10px 0; }
    </style>
</head>
<body>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h1>AUTO TUNE</h1>
        <a href="index.html" class="back">BACK</a>
    </div>
    
    <div class="grid">
        <div class="card">
            <h2>MOTOR CONFIG</h2>
            <div class="field">
                <label>Motor</label>
                <select id="motor" onchange="recalc()">
                    <option value="435">GoBilda 5202 - 435 RPM</option>
                    <option value="312">GoBilda 5203 - 312 RPM</option>
                    <option value="1150">GoBilda 5204 - 1150 RPM</option>
                    <option value="6000">REV HD Hex - 6000 RPM</option>
                    <option value="2000">REV Core Hex - 2000 RPM</option>
                    <option value="custom">Custom</option>
                </select>
            </div>
            <div class="field" id="customField" style="display:none">
                <label>Custom RPM</label>
                <input type="number" id="customRpm" value="435" onchange="recalc()">
            </div>
            <div class="field-row">
                <div class="field">
                    <label>Gear Ratio</label>
                    <input type="number" id="gearRatio" value="3" step="0.1" onchange="recalc()">
                </div>
                <div class="field">
                    <label>Efficiency %</label>
                    <input type="number" id="efficiency" value="90" onchange="recalc()">
                </div>
            </div>
            <div class="sep"></div>
            <div style="font-size:10px;color:#555;line-height:1.8">
                <div>Free Speed: <span id="freeSpeed">435</span> RPM</div>
                <div>Output RPM: <span id="outputRpm">--</span></div>
            </div>
        </div>
        
        <div class="card">
            <h2>TUNING CONFIG</h2>
            <div class="field-row">
                <div class="field">
                    <label>Target RPM</label>
                    <input type="number" id="targetRpm" value="3000">
                </div>
                <div class="field">
                    <label>Runs</label>
                    <input type="number" id="numRuns" value="5" min="1" max="20">
                </div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label>Relay Amplitude</label>
                    <input type="number" id="amplitude" value="0.3" step="0.05">
                </div>
                <div class="field">
                    <label>Settle Time (ms)</label>
                    <input type="number" id="settleTime" value="500">
                </div>
            </div>
            <div class="progress">
                <div class="progress-header">
                    <span id="progStage">IDLE</span>
                    <span id="progPct">0%</span>
                </div>
                <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
            </div>
            <div class="btn-group">
                <button class="btn" onclick="start()">START</button>
                <button class="btn red" onclick="stop()">STOP</button>
                <button class="btn dark" onclick="apply()">APPLY</button>
            </div>
        </div>
        
        <div class="card">
            <h2>RESULTS</h2>
            <div class="result-grid">
                <div class="result-item"><div class="result-value" id="rKp">--</div><div class="result-label">Kp</div></div>
                <div class="result-item"><div class="result-value" id="rKi">--</div><div class="result-label">Ki</div></div>
                <div class="result-item"><div class="result-value" id="rKd">--</div><div class="result-label">Kd</div></div>
                <div class="result-item"><div class="result-value" id="rKv">--</div><div class="result-label">Kv</div></div>
                <div class="result-item"><div class="result-value" id="rKa">--</div><div class="result-label">Ka</div></div>
                <div class="result-item"><div class="result-value" id="rKu">--</div><div class="result-label">Ku</div></div>
            </div>
            <div class="sep"></div>
            <div id="runHistory" style="max-height:100px;overflow-y:auto"></div>
        </div>
        
        <div class="card">
            <h2>CHART</h2>
            <div class="chart-box"><canvas id="chart"></canvas></div>
        </div>
        
        <div class="card full">
            <h2>LOG</h2>
            <div class="log" id="log"><div class="i">Ready. Configure motor and click Start.</div></div>
        </div>
    </div>

    <script>
        let running = false, chartData = [], runs = [], ctx;
        let motorRpm = 435, gearRatio = 3, efficiency = 0.9;
        
        function init() {
            ctx = document.getElementById('chart').getContext('2d');
            recalc();
        }
        
        function recalc() {
            const v = document.getElementById('motor').value;
            document.getElementById('customField').style.display = v === 'custom' ? 'block' : 'none';
            motorRpm = v === 'custom' ? (parseFloat(document.getElementById('customRpm').value) || 435) : parseFloat(v);
            gearRatio = parseFloat(document.getElementById('gearRatio').value) || 1;
            efficiency = (parseFloat(document.getElementById('efficiency').value) || 90) / 100;
            
            document.getElementById('freeSpeed').textContent = motorRpm;
            document.getElementById('outputRpm').textContent = (motorRpm / gearRatio * efficiency).toFixed(0);
        }
        
        function addLog(msg, cls) {
            const l = document.getElementById('log');
            const t = new Date().toLocaleTimeString();
            l.innerHTML += `<div><span class="t">[${t}]</span> <span class="${cls}">${msg}</span></div>`;
            l.scrollTop = l.scrollHeight;
        }
        
        function setProgress(stage, pct) {
            document.getElementById('progStage').textContent = stage;
            document.getElementById('progPct').textContent = Math.round(pct) + '%';
            document.getElementById('progFill').style.width = pct + '%';
        }
        
        function start() {
            if (running) return;
            running = true;
            runs = [];
            chartData = [];
            addLog('Starting auto-tune...', 'i');
            simulate();
        }
        
        function stop() {
            running = false;
            addLog('Stopped.', 'w');
        }
        
        function simulate() {
            const target = parseFloat(document.getElementById('targetRpm').value) || 3000;
            const amp = parseFloat(document.getElementById('amplitude').value) || 0.3;
            const numRuns = parseInt(document.getElementById('numRuns').value) || 5;
            
            let vel = 0, time = 0, relayOn = true, crossings = 0, periods = [], lastCross = 0;
            const dt = 0.01;
            let runCount = 0;
            
            const interval = setInterval(() => {
                if (!running) { clearInterval(interval); return; }
                
                const err = target - vel;
                const out = relayOn ? amp : -amp;
                vel += (out * 2000 - vel * 2) * dt;
                vel = Math.max(0, Math.min(vel, target * 1.5));
                
                if (time > 0.5) {
                    if ((err > 0 && (target - (vel - (out * 2000 - vel * 2) * dt)) <= 0) ||
                        (err < 0 && (target - (vel - (out * 2000 - vel * 2) * dt)) >= 0)) {
                        crossings++;
                        if (crossings % 2 === 0) {
                            const p = time - lastCross;
                            if (p > 0.05 && p < 2) periods.push(p);
                            lastCross = time;
                        }
                    }
                }
                
                chartData.push([time, vel, target]);
                if (chartData.length > 300) chartData.shift();
                
                if (Math.floor(time * 100) % 5 === 0) drawChart();
                
                time += dt;
                
                if (crossings >= 10) {
                    clearInterval(interval);
                    const Tu = periods.length ? periods.reduce((a, b) => a + b) / periods.length : 0.3;
                    const Ku = amp / (target * 0.08);
                    const Kp = 0.6 * Ku;
                    const Ki = 2 * Kp / Tu;
                    const Kd = Kp * Tu / 8;
                    const Kv = 1 / (motorRpm / 12 * gearRatio * efficiency);
                    
                    runs.push({ Kp, Ki, Kd, Kv, Ku, Tu });
                    addRun({ Kp, Ki, Kd, Kv, Ku, Tu });
                    
                    document.getElementById('rKp').textContent = Kp.toFixed(6);
                    document.getElementById('rKi').textContent = Ki.toFixed(6);
                    document.getElementById('rKd').textContent = Kd.toFixed(6);
                    document.getElementById('rKv').textContent = Kv.toFixed(6);
                    document.getElementById('rKa').textContent = '0.000000';
                    document.getElementById('rKu').textContent = Ku.toFixed(4);
                    
                    addLog(`Run ${runs.length}: Kp=${Kp.toFixed(6)} Ki=${Ki.toFixed(6)} Kd=${Kd.toFixed(6)}`, 's');
                    setProgress(`Run ${runs.length}/${numRuns}`, runs.length / numRuns * 100);
                    
                    runCount++;
                    if (runCount < numRuns && running) {
                        setTimeout(() => { vel = 0; time = 0; crossings = 0; periods = []; simulate(); }, 500);
                    } else {
                        running = false;
                        addLog('Complete!', 's');
                        setProgress('DONE', 100);
                    }
                }
            }, dt * 1000);
        }
        
        function addRun(r) {
            const h = document.getElementById('runHistory');
            const d = document.createElement('div');
            d.className = 'run-item';
            d.innerHTML = `<span>#${runs.length}</span><span>Kp:${r.Kp.toFixed(4)}</span><span>Ki:${r.Ki.toFixed(4)}</span><span>Kd:${r.Kd.toFixed(4)}</span>`;
            h.appendChild(d);
        }
        
        function apply() {
            const p = document.getElementById('rKp').textContent;
            const i = document.getElementById('rKi').textContent;
            const d = document.getElementById('rKd').textContent;
            const code = `@Config\nobject PIDConfig {\n    @JvmField var Kp = ${p}\n    @JvmField var Ki = ${i}\n    @JvmField var Kd = ${d}\n}`;
            navigator.clipboard.writeText(code).then(() => addLog('Copied to clipboard!', 's'));
        }
        
        function drawChart() {
            const cv = ctx.canvas;
            cv.width = cv.offsetWidth;
            cv.height = cv.offsetHeight;
            const w = cv.width, h = cv.height;
            
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, w, h);
            
            if (chartData.length < 2) return;
            
            let all = chartData.flatMap(d => [d[1], d[2]]);
            let mn = Math.min(...all), mx = Math.max(...all);
            let r = mx - mn || 1;
            mn -= r * 0.1;
            mx += r * 0.1;
            
            ctx.strokeStyle = '#1a1a1a';
            for (let i = 0; i <= 4; i++) {
                ctx.beginPath();
                ctx.moveTo(0, h / 4 * i);
                ctx.lineTo(w, h / 4 * i);
                ctx.stroke();
            }
            
            ctx.strokeStyle = '#333';
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            const ty = h - (chartData[0][2] - mn) / (mx - mn) * h;
            ctx.moveTo(0, ty);
            ctx.lineTo(w, ty);
            ctx.stroke();
            ctx.setLineDash([]);
            
            ctx.strokeStyle = '#ccc';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            chartData.forEach((d, i) => {
                const x = i / 300 * w;
                const y = h - (d[1] - mn) / (mx - mn) * h;
                i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            });
            ctx.stroke();
        }
        
        window.onload = init;
    </script>
</body>
</html>
