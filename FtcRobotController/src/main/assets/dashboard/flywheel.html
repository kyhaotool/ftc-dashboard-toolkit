<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLYWHEEL CALC</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Consolas', monospace; background: #111; color: #ddd; min-height: 100vh; padding: 20px; }
        h1 { font-size: 18px; font-weight: 400; letter-spacing: 2px; margin-bottom: 20px; color: #fff; }
        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        @media(max-width: 1100px) { .grid { grid-template-columns: 1fr 1fr; } }
        @media(max-width: 700px) { .grid { grid-template-columns: 1fr; } }
        .card { background: #1a1a1a; border: 1px solid #333; padding: 16px; }
        .card h2 { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #333; }
        .full { grid-column: 1 / -1; }
        .field { margin-bottom: 8px; }
        .field label { display: block; font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; }
        .field input, .field select { width: 100%; padding: 7px; background: #111; border: 1px solid #333; color: #ddd; font-family: inherit; font-size: 11px; }
        .field input:focus, .field select:focus { outline: none; border-color: #888; }
        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .result-box { background: #111; border: 1px solid #222; padding: 10px; margin-top: 8px; }
        .result-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #1a1a1a; font-size: 11px; }
        .result-row:last-child { border: none; }
        .result-label { color: #555; }
        .result-value { color: #ccc; font-weight: 600; }
        .result-value.good { color: #aaa; }
        .btn { padding: 8px 14px; background: #ddd; color: #111; border: none; font-family: inherit; font-size: 11px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
        .btn:hover { background: #fff; }
        .btn.dark { background: #333; color: #ddd; }
        .btn-group { display: flex; gap: 6px; margin-top: 10px; }
        .chart-box { background: #0a0a0a; border: 1px solid #222; height: 200px; margin-top: 10px; }
        .chart-box canvas { width: 100%; height: 100%; }
        .shot-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
        @media(max-width: 800px) { .shot-grid { grid-template-columns: repeat(3, 1fr); } }
        .shot-item { background: #111; border: 1px solid #222; padding: 10px; text-align: center; }
        .shot-val { font-size: 16px; color: #fff; }
        .shot-lbl { font-size: 8px; color: #555; text-transform: uppercase; margin-top: 2px; }
        .toggle { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .toggle input { width: 14px; height: 14px; }
        .toggle label { font-size: 10px; color: #666; cursor: pointer; }
        a.back { color: #666; font-size: 10px; text-decoration: none; text-transform: uppercase; letter-spacing: 1px; }
        a.back:hover { color: #fff; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: #1a1a1a; border: 1px solid #333; padding: 20px; max-width: 600px; width: 90%; }
        .modal h3 { font-size: 14px; color: #fff; margin-bottom: 12px; }
        .modal pre { background: #0a0a0a; border: 1px solid #222; padding: 12px; font-size: 10px; color: #aaa; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
        .modal-actions { display: flex; gap: 6px; margin-top: 12px; }
    </style>
</head>
<body>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h1>FLYWHEEL CALC</h1>
        <a href="index.html" class="back">BACK</a>
    </div>
    
    <div class="grid">
        <div class="card">
            <h2>MOTOR</h2>
            <div class="field">
                <label>Motor</label>
                <select id="motor" onchange="recalc()">
                    <option value="435">GoBilda 5202 - 435 RPM</option>
                    <option value="312">GoBilda 5203 - 312 RPM</option>
                    <option value="1150">GoBilda 5204 - 1150 RPM</option>
                    <option value="6000">REV HD Hex - 6000 RPM</option>
                    <option value="2000">REV Core Hex - 2000 RPM</option>
                </select>
            </div>
            <div class="field-row">
                <div class="field">
                    <label>Qty</label>
                    <input type="number" id="qty" value="2" min="1" max="6" onchange="recalc()">
                </div>
                <div class="field">
                    <label>Ratio</label>
                    <input type="number" id="ratio" value="1" step="0.1" onchange="recalc()">
                </div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label>Efficiency %</label>
                    <input type="number" id="eff" value="100" onchange="recalc()">
                </div>
                <div class="field">
                    <label>Target RPM</label>
                    <input type="number" id="targetRpm" value="2000" onchange="recalc()">
                </div>
            </div>
            <div class="result-box">
                <div class="result-row"><span class="result-label">Free Speed</span><span class="result-value" id="rFree">435</span></div>
                <div class="result-row"><span class="result-label">Output RPM</span><span class="result-value" id="rOutput">--</span></div>
                <div class="result-row"><span class="result-label">Stall Torque</span><span class="result-value" id="rTorque">--</span></div>
            </div>
        </div>
        
        <div class="card">
            <h2>SHOOTER</h2>
            <div class="field-row">
                <div class="field">
                    <label>Diameter (in)</label>
                    <input type="number" id="dia" value="3.54" step="0.01" onchange="recalc()">
                </div>
                <div class="field">
                    <label>Weight (lbs)</label>
                    <input type="number" id="weight" value="1.55" step="0.01" onchange="recalc()">
                </div>
            </div>
            <div class="result-box">
                <div class="result-row"><span class="result-label">MOI</span><span class="result-value" id="rMoi">--</span></div>
                <div class="result-row"><span class="result-label">Radius</span><span class="result-value" id="rRadius">--</span></div>
            </div>
        </div>
        
        <div class="card">
            <h2>RESULTS</h2>
            <div class="result-box">
                <div class="result-row"><span class="result-label">Spinup Time</span><span class="result-value" id="rSpinup">--</span></div>
                <div class="result-row"><span class="result-label">kV</span><span class="result-value" id="rKv">--</span></div>
                <div class="result-row"><span class="result-label">kA</span><span class="result-value" id="rKa">--</span></div>
                <div class="result-row"><span class="result-label">Exit Velocity</span><span class="result-value" id="rExit">--</span></div>
                <div class="result-row"><span class="result-label">Speed Drop</span><span class="result-value" id="rDrop">--</span></div>
            </div>
        </div>
        
        <div class="card full">
            <h2>SHOT ANALYSIS</h2>
            <div class="shot-grid">
                <div class="shot-item"><div class="shot-val" id="sVel">--</div><div class="shot-lbl">EXIT VEL (ft/s)</div></div>
                <div class="shot-item"><div class="shot-val" id="sSpin">--</div><div class="shot-lbl">SPIN (rpm)</div></div>
                <div class="shot-item"><div class="shot-val" id="sEnergy">--</div><div class="shot-lbl">ENERGY (J)</div></div>
                <div class="shot-item"><div class="shot-val" id="sDrop">--</div><div class="shot-lbl">SPEED DROP</div></div>
                <div class="shot-item"><div class="shot-val" id="sPost">--</div><div class="shot-lbl">POST-SHOT</div></div>
                <div class="shot-item"><div class="shot-val" id="sMax">--</div><div class="shot-lbl">MAX RPM</div></div>
            </div>
        </div>
        
        <div class="card full">
            <h2>CHART</h2>
            <div class="chart-box"><canvas id="chart"></canvas></div>
            <div class="btn-group">
                <button class="btn" onclick="runSim()">RUN SIMULATION</button>
                <button class="btn dark" onclick="saveConfig()">SAVE CONFIG</button>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h3>CONFIG (KOTLIN)</h3>
            <pre id="modalCode"></pre>
            <div class="modal-actions">
                <button class="btn" onclick="copyConfig()">COPY</button>
                <button class="btn dark" onclick="document.getElementById('modal').classList.remove('active')">CLOSE</button>
            </div>
        </div>
    </div>

    <script>
        const IN_TO_M = 0.0254, LBS_TO_KG = 0.453592, RPM_TO_RAD = Math.PI / 30;
        let ctx;
        
        function init() {
            ctx = document.getElementById('chart').getContext('2d');
            recalc();
        }
        
        function recalc() {
            const rpm = parseFloat(document.getElementById('motor').value) || 435;
            const qty = parseInt(document.getElementById('qty').value) || 1;
            const ratio = parseFloat(document.getElementById('ratio').value) || 1;
            const eff = (parseFloat(document.getElementById('eff').value) || 100) / 100;
            const target = parseFloat(document.getElementById('targetRpm').value) || 2000;
            const dia = parseFloat(document.getElementById('dia').value) || 3.54;
            const w = parseFloat(document.getElementById('weight').value) || 1.55;
            
            const outputRpm = rpm / ratio * eff;
            const stallTorque = qty * 560;
            const moi = 0.5 * (w * LBS_TO_KG) * Math.pow((dia / 2) * IN_TO_M, 2);
            const kv = 1 / (rpm / 12 * ratio * eff);
            const ka = 4.8 * moi / Math.pow(rpm / 12 * ratio, 2);
            const freeRad = rpm * RPM_TO_RAD / ratio;
            const targetRad = target * RPM_TO_RAD;
            const alpha = (stallTorque * 0.00706155 * (1 - targetRad / freeRad)) / moi;
            const spinup = alpha > 0 ? (targetRad * 0.9) / alpha : 999;
            
            const r = (dia / 2) * IN_TO_M;
            const omega = outputRpm * RPM_TO_RAD;
            const vBall = r * omega;
            const exitVel = vBall / 0.3048;
            
            document.getElementById('rFree').textContent = rpm;
            document.getElementById('rOutput').textContent = outputRpm.toFixed(0) + ' RPM';
            document.getElementById('rTorque').textContent = stallTorque + ' oz-in';
            document.getElementById('rMoi').textContent = (moi * 1000000).toFixed(2) + ' g*cm2';
            document.getElementById('rRadius').textContent = dia.toFixed(2) + ' in';
            document.getElementById('rSpinup').textContent = spinup.toFixed(3) + ' s';
            document.getElementById('rKv').textContent = kv.toFixed(6);
            document.getElementById('rKa').textContent = ka.toFixed(6);
            document.getElementById('rExit').textContent = exitVel.toFixed(1) + ' ft/s';
            document.getElementById('rDrop').textContent = (outputRpm * 0.1).toFixed(0) + ' RPM';
            
            document.getElementById('sVel').textContent = exitVel.toFixed(1);
            document.getElementById('sSpin').textContent = (omega * 60 / (2 * Math.PI)).toFixed(0);
            document.getElementById('sEnergy').textContent = (0.5 * 0.025 * vBall * vBall).toFixed(3);
            document.getElementById('sDrop').textContent = (outputRpm * 0.1).toFixed(0);
            document.getElementById('sPost').textContent = (outputRpm * 0.9).toFixed(0);
            document.getElementById('sMax').textContent = outputRpm.toFixed(0);
        }
        
        function runSim() {
            const rpm = parseFloat(document.getElementById('motor').value) || 435;
            const qty = parseInt(document.getElementById('qty').value) || 1;
            const ratio = parseFloat(document.getElementById('ratio').value) || 1;
            const eff = (parseFloat(document.getElementById('eff').value) || 100) / 100;
            const target = parseFloat(document.getElementById('targetRpm').value) || 2000;
            const dia = parseFloat(document.getElementById('dia').value) || 3.54;
            const w = parseFloat(document.getElementById('weight').value) || 1.55;
            
            const moi = 0.5 * (w * LBS_TO_KG) * Math.pow((dia / 2) * IN_TO_M, 2);
            const freeRad = rpm * RPM_TO_RAD / ratio;
            const targetRad = target * RPM_TO_RAD;
            
            let omega = 0, t = 0;
            const data = [];
            const dt = 0.001;
            
            while (t < 3 && omega < targetRad * 0.99) {
                const torque = qty * 560 * 0.00706155 * (1 - omega / freeRad);
                const alpha = (torque * eff - omega * 0.01) / moi;
                omega += alpha * dt;
                omega = Math.max(0, omega);
                
                if (Math.floor(t * 100) % 2 === 0) {
                    data.push({ t, rpm: omega / RPM_TO_RAD });
                }
                t += dt;
            }
            
            drawChart(data, target);
        }
        
        function drawChart(data, target) {
            const cv = ctx.canvas;
            cv.width = cv.offsetWidth;
            cv.height = cv.offsetHeight;
            const w = cv.width, h = cv.height;
            
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, w, h);
            
            if (data.length < 2) return;
            
            const maxT = data[data.length - 1].t;
            const maxRpm = Math.max(target * 1.2, ...data.map(d => d.rpm));
            
            ctx.strokeStyle = '#1a1a1a';
            for (let i = 0; i <= 4; i++) {
                ctx.beginPath();
                ctx.moveTo(0, h / 4 * i);
                ctx.lineTo(w, h / 4 * i);
                ctx.stroke();
            }
            
            ctx.strokeStyle = '#333';
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            const ty = h - (target / maxRpm) * h;
            ctx.moveTo(0, ty);
            ctx.lineTo(w, ty);
            ctx.stroke();
            ctx.setLineDash([]);
            
            ctx.strokeStyle = '#ccc';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            data.forEach((d, i) => {
                const x = (d.t / maxT) * w;
                const y = h - (d.rpm / maxRpm) * h;
                i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            });
            ctx.stroke();
        }
        
        function saveConfig() {
            const rpm = parseFloat(document.getElementById('motor').value);
            const ratio = parseFloat(document.getElementById('ratio').value);
            const target = parseFloat(document.getElementById('targetRpm').value);
            
            const code = `@Config\nobject FlywheelConfig {\n    const val MOTOR_RPM = ${rpm}\n    const val GEAR_RATIO = ${ratio}\n    const val TARGET_RPM = ${target}\n    @JvmField var PIDF_P = 0.001\n    @JvmField var FF_KV = ${(1 / (rpm / 12 * ratio)).toFixed(6)}\n}`;
            
            document.getElementById('modalCode').textContent = code;
            document.getElementById('modal').classList.add('active');
        }
        
        function copyConfig() {
            navigator.clipboard.writeText(document.getElementById('modalCode').textContent);
        }
        
        window.onload = init;
    </script>
</body>
</html>
