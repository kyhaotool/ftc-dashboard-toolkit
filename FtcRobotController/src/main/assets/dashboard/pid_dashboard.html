<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRC_34034 PID Tuner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Consolas', 'Courier New', monospace;
            background: #000;
            color: #fff;
            min-height: 100vh;
        }
        
        .header {
            background: #111;
            padding: 16px 24px;
            border-bottom: 1px solid #333;
        }
        
        .header h1 {
            font-size: 18px;
            font-weight: 400;
            letter-spacing: 2px;
        }
        
        .header p {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #222;
            margin-bottom: 20px;
        }
        
        .connection {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .dot {
            width: 8px;
            height: 8px;
            background: #333;
            border-radius: 50%;
        }
        
        .dot.on {
            background: #fff;
            box-shadow: 0 0 8px #fff;
        }
        
        .top-bar input {
            background: #111;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 12px;
            font-family: inherit;
            font-size: 12px;
        }
        
        .top-bar input:focus {
            outline: none;
            border-color: #666;
        }
        
        .btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn:hover {
            background: #ccc;
        }
        
        .btn.outline {
            background: transparent;
            color: #fff;
            border: 1px solid #333;
        }
        
        .btn.outline:hover {
            border-color: #fff;
        }
        
        .modules {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .module {
            padding: 10px 20px;
            background: #111;
            border: 1px solid #333;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .module:hover {
            color: #fff;
            border-color: #666;
        }
        
        .module.active {
            color: #000;
            background: #fff;
            border-color: #fff;
        }
        
        .main {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
        }
        
        @media (max-width: 900px) {
            .main { grid-template-columns: 1fr; }
        }
        
        .panel {
            background: #111;
            border: 1px solid #222;
            padding: 20px;
        }
        
        .panel-title {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #222;
        }
        
        .field {
            margin-bottom: 16px;
        }
        
        .field label {
            display: block;
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        
        .field-row {
            display: flex;
            gap: 4px;
        }
        
        .field input {
            flex: 1;
            background: #000;
            border: 1px solid #333;
            color: #fff;
            padding: 10px;
            font-family: inherit;
            font-size: 14px;
        }
        
        .field input:focus {
            outline: none;
            border-color: #fff;
        }
        
        .field .btn-sm {
            padding: 10px 14px;
            font-size: 14px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }
        
        .stat {
            background: #000;
            border: 1px solid #222;
            padding: 12px;
        }
        
        .stat-label {
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: 400;
        }
        
        .stat-unit {
            font-size: 10px;
            color: #444;
        }
        
        .actions {
            display: flex;
            gap: 8px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .chart-area {
            margin-bottom: 16px;
        }
        
        .chart-label {
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        
        .chart-box {
            background: #000;
            border: 1px solid #222;
            height: 120px;
            position: relative;
        }
        
        .chart-box canvas {
            width: 100%;
            height: 100%;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            color: #333;
            font-size: 10px;
            border-top: 1px solid #111;
            margin-top: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>PID TUNER</h1>
        <p>HRC_34034 | FTC 2026 DECODE</p>
    </div>
    
    <div class="container">
        <div class="top-bar">
            <div class="connection">
                <div class="dot" id="dot"></div>
                <span id="status">OFFLINE</span>
            </div>
            <div style="display:flex;gap:8px;">
                <input type="text" id="ip" value="192.168.43.1" style="width:140px;">
                <input type="number" id="port" value="8080" style="width:70px;">
                <button class="btn" onclick="connect()">CONNECT</button>
                <button class="btn outline" onclick="disconnect()">DISCONNECT</button>
            </div>
        </div>
        
        <div class="modules">
            <button class="module active" onclick="select('drive')" id="m-drive">DRIVE</button>
            <button class="module" onclick="select('arm')" id="m-arm">ARM</button>
            <button class="module" onclick="select('intake')" id="m-intake">INTAKE</button>
            <button class="module" onclick="select('wrist')" id="m-wrist">WRIST</button>
            <button class="module" onclick="select('outtake')" id="m-outtake">OUTTAKE</button>
            <button class="module" onclick="select('custom')" id="m-custom">CUSTOM</button>
        </div>
        
        <div class="main">
            <div>
                <div class="panel">
                    <div class="panel-title">PID PARAMETERS</div>
                    
                    <div class="field">
                        <label>Kp</label>
                        <div class="field-row">
                            <input type="number" id="kp" value="0.010" step="0.001">
                            <button class="btn btn-sm" onclick="adj('kp',0.001)">+</button>
                            <button class="btn btn-sm outline" onclick="adj('kp',-0.001)">-</button>
                        </div>
                    </div>
                    
                    <div class="field">
                        <label>Ki</label>
                        <div class="field-row">
                            <input type="number" id="ki" value="0.000" step="0.001">
                            <button class="btn btn-sm" onclick="adj('ki',0.001)">+</button>
                            <button class="btn btn-sm outline" onclick="adj('ki',-0.001)">-</button>
                        </div>
                    </div>
                    
                    <div class="field">
                        <label>Kd</label>
                        <div class="field-row">
                            <input type="number" id="kd" value="0.000" step="0.001">
                            <button class="btn btn-sm" onclick="adj('kd',0.001)">+</button>
                            <button class="btn btn-sm outline" onclick="adj('kd',-0.001)">-</button>
                        </div>
                    </div>
                    
                    <div class="field">
                        <label>Kf</label>
                        <div class="field-row">
                            <input type="number" id="kf" value="0.000" step="0.001">
                            <button class="btn btn-sm" onclick="adj('kf',0.001)">+</button>
                            <button class="btn btn-sm outline" onclick="adj('kf',-0.001)">-</button>
                        </div>
                    </div>
                    
                    <div class="field">
                        <label>TARGET</label>
                        <div class="field-row">
                            <input type="number" id="target" value="500" step="50">
                            <button class="btn btn-sm" onclick="adj('target',50)">+</button>
                            <button class="btn btn-sm outline" onclick="adj('target',-50)">-</button>
                        </div>
                    </div>
                    
                    <div class="actions">
                        <button class="btn" onclick="send()">SEND</button>
                        <button class="btn" onclick="start()">START</button>
                        <button class="btn outline" onclick="stop()">STOP</button>
                        <button class="btn outline" onclick="reset()">RESET</button>
                    </div>
                </div>
                
                <div class="panel" style="margin-top:12px;">
                    <div class="panel-title">STATUS</div>
                    <div class="stats">
                        <div class="stat">
                            <div class="stat-label">ENCODER</div>
                            <div class="stat-value" id="v-enc">0</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">VELOCITY</div>
                            <div class="stat-value" id="v-vel">0</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">POWER</div>
                            <div class="stat-value" id="v-pow">0.00</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">ERROR</div>
                            <div class="stat-value" id="v-err">0</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="panel">
                <div class="panel-title">REALTIME</div>
                
                <div class="chart-area">
                    <div class="chart-label">POSITION</div>
                    <div class="chart-box"><canvas id="c1"></canvas></div>
                </div>
                
                <div class="chart-area">
                    <div class="chart-label">ERROR</div>
                    <div class="chart-box"><canvas id="c2"></canvas></div>
                </div>
                
                <div class="chart-area">
                    <div class="chart-label">OUTPUT</div>
                    <div class="chart-box"><canvas id="c3"></canvas></div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="footer">HRC_34034 | PID TUNER v1.0</div>

    <script>
        let mod = 'drive';
        let ws = null;
        let online = false;
        let enc = 0, vel = 0, pow = 0, err = 0;
        let d1 = [], d2 = [], d3 = [], d4 = [];
        const MAX = 100;
        let c1, c2, c3;
        
        const cfg = {
            drive: { kp: 0.01, ki: 0, kd: 0, kf: 0 },
            arm: { kp: 0.02, ki: 0.001, kd: 0, kf: 0 },
            intake: { kp: 0.015, ki: 0, kd: 0, kf: 0 },
            wrist: { kp: 0.02, ki: 0.001, kd: 0.005, kf: 0 },
            outtake: { kp: 0.005, ki: 0.001, kd: 0, kf: 0.1 },
            custom: { kp: 0.01, ki: 0, kd: 0, kf: 0 }
        };
        
        function init() {
            c1 = document.getElementById('c1').getContext('2d');
            c2 = document.getElementById('c2').getContext('2d');
            c3 = document.getElementById('c3').getContext('2d');
            select('drive');
            loop();
        }
        
        function select(m) {
            mod = m;
            document.querySelectorAll('.module').forEach(b => b.classList.remove('active'));
            document.getElementById('m-' + m).classList.add('active');
            
            const c = cfg[m];
            document.getElementById('kp').value = c.kp.toFixed(3);
            document.getElementById('ki').value = c.ki.toFixed(3);
            document.getElementById('kd').value = c.kd.toFixed(3);
            document.getElementById('kf').value = c.kf.toFixed(3);
            
            d1 = []; d2 = []; d3 = []; d4 = [];
        }
        
        function connect() {
            const ip = document.getElementById('ip').value;
            const port = document.getElementById('port').value;
            
            try {
                ws = new WebSocket('ws://' + ip + ':' + port + '/ws');
                ws.onopen = () => {
                    online = true;
                    document.getElementById('dot').classList.add('on');
                    document.getElementById('status').textContent = 'ONLINE';
                };
                ws.onmessage = (e) => {
                    const d = JSON.parse(e.data);
                    update(d);
                };
                ws.onclose = () => { offline(); };
                ws.onerror = () => { offline(); };
            } catch(e) {
                offline();
            }
        }
        
        function disconnect() {
            if (ws) ws.close();
            offline();
        }
        
        function offline() {
            online = false;
            document.getElementById('dot').classList.remove('on');
            document.getElementById('status').textContent = 'OFFLINE';
        }
        
        function update(d) {
            if (d.enc !== undefined) {
                enc = d.enc;
                vel = d.vel || 0;
                pow = d.pow || 0;
                err = d.err || 0;
                
                document.getElementById('v-enc').textContent = Math.round(enc);
                document.getElementById('v-vel').textContent = Math.round(vel);
                document.getElementById('v-pow').textContent = pow.toFixed(2);
                document.getElementById('v-err').textContent = Math.round(err);
                
                d1.push(enc);
                d2.push(err);
                d3.push(pow);
                d4.push(parseFloat(document.getElementById('target').value));
                
                if (d1.length > MAX) { d1.shift(); d2.shift(); d3.shift(); d4.shift(); }
            }
        }
        
        function loop() {
            if (!online) sim();
            draw(c1, d1, d4, '#fff', '#444');
            draw(c2, d2, [], '#fff', null);
            draw(c3, d3, [], '#fff', null);
            requestAnimationFrame(loop);
        }
        
        function sim() {
            const kp = parseFloat(document.getElementById('kp').value);
            const tgt = parseFloat(document.getElementById('target').value);
            const e = tgt - enc;
            const o = Math.max(-1, Math.min(1, kp * e * 0.01));
            enc += o * 10;
            update({ enc, vel: o * 1000, pow: o, err: e });
        }
        
        function draw(ctx, data, target, color, tColor) {
            const cv = ctx.canvas;
            cv.width = cv.offsetWidth;
            cv.height = cv.offsetHeight;
            const w = cv.width, h = cv.height;
            
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, w, h);
            
            if (data.length < 2) return;
            
            let all = [...data, ...target];
            let mn = Math.min(...all), mx = Math.max(...all);
            let r = mx - mn || 1;
            mn -= r * 0.1;
            mx += r * 0.1;
            
            ctx.strokeStyle = '#111';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 4; i++) {
                ctx.beginPath();
                ctx.moveTo(0, h / 4 * i);
                ctx.lineTo(w, h / 4 * i);
                ctx.stroke();
            }
            
            if (target.length && tColor) {
                ctx.strokeStyle = tColor;
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                target.forEach((v, i) => {
                    const x = i / (MAX - 1) * w;
                    const y = h - (v - mn) / (mx - mn) * h;
                    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                });
                ctx.stroke();
                ctx.setLineDash([]);
            }
            
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            data.forEach((v, i) => {
                const x = i / (MAX - 1) * w;
                const y = h - (v - mn) / (mx - mn) * h;
                i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            });
            ctx.stroke();
        }
        
        function adj(id, d) {
            const el = document.getElementById(id);
            let v = parseFloat(el.value) + d;
            if (id === 'target') v = Math.round(v / 50) * 50;
            else v = Math.max(0, parseFloat(v.toFixed(4)));
            el.value = v;
            cfg[mod][id] = v;
        }
        
        function send() {
            const p = {
                kp: parseFloat(document.getElementById('kp').value),
                ki: parseFloat(document.getElementById('ki').value),
                kd: parseFloat(document.getElementById('kd').value),
                kf: parseFloat(document.getElementById('kf').value),
                target: parseFloat(document.getElementById('target').value)
            };
            cfg[mod] = { ...cfg[mod], ...p };
            if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'pid', mod, ...p }));
        }
        
        function start() {
            send();
            if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'start', mod }));
        }
        
        function stop() {
            if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'stop', mod }));
        }
        
        function reset() {
            enc = 0; vel = 0; pow = 0; err = 0;
            d1 = []; d2 = []; d3 = []; d4 = [];
            if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'reset', mod }));
        }
        
        window.onload = init;
    </script>
</body>
</html>
